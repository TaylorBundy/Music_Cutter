<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Cortar Música</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="card">
      <div class="cortar_musica">
        <h2>Cortar Música</h2>

        <input type="file" id="file" />

        <label>Inicio (segundos)</label>
        <input type="number" id="start" />

        <label>Fin (segundos)</label>
        <input type="number" id="end" />

        <label>Fade In (segundos)</label>
        <input type="number" id="fadeIn" />

        <label>Fade Out (segundos)</label>
        <input type="number" id="fadeOut" />
        <div class="formato_descarga">
          <label>Formato de descarga</label>
          <select id="format">
            <option value="wav">WAV</option>
            <option value="mp3">MP3</option>
            <option value="ogg">OGG</option>
            <option value="flac">FLAC</option>
          </select>
        </div>

        <button onclick="procesar()">Procesar</button>

        <br /><br />

        <a id="download"></a>
      </div>
      <div class="convertir_musica">
        <h2>Convertir WAV a MP3</h2>

        <input type="file" id="fileInput" accept=".wav" />

        <button id="convertBtn">Convertir</button>

        <a id="downloadLink" style="display: none">Descargar MP3</a>

        <p id="status"></p>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.0/lame.min.js"></script>
    <script src="script.js"></script>
    <script src="script2.js"></script>
  </body>
</html>
