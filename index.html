<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="shortcut icon" href="images/favicon.ico" />
    <title>Cortar Música</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="card">
      <div class="cortar_musica">
        <h2>Cortar Música</h2>

        <div class="agregar_archivo">
          <img class="imgBtn" src="images/agregar.avif" />
          <input type="file" id="file" />
        </div>

        <label>Inicio (segundos)</label>
        <input
          type="number"
          id="start"
          data-title="Ingrese los segundos iniciales para cortrar:"
        />

        <label>Fin (segundos)</label>
        <input
          type="number"
          id="end"
          data-title="Ingrese los segundos finales para cortar:"
        />

        <label>Fade In (segundos)</label>
        <input
          type="number"
          id="fadeIn"
          data-title="Ingrese los segundos iniciales para agregar efecto:"
        />

        <label>Fade Out (segundos)</label>
        <input
          type="number"
          id="fadeOut"
          data-title="Ingrese los segundos finales para agregar efecto:"
        />
        <div class="formato_descarga">
          <label>Formato de descarga</label>
          <select id="format">
            <option value="wav">WAV</option>
            <option value="mp3">MP3</option>
            <option value="ogg">OGG</option>
            <option value="flac">FLAC</option>
          </select>
        </div>

        <button onclick="procesar()">
          <img class="imgBtn" src="images/cortar.avif" />
          Procesar
        </button>

        <br /><br />

        <a id="download"></a>
      </div>
      <div class="convertir_musica">
        <h2>Convertir WAV a MP3</h2>

        <div class="agregar_archivo">
          <img class="imgBtn" src="images/agregar.avif" />
          <input type="file" id="fileInput" accept=".wav" />
        </div>

        <button id="convertBtn">
          <img class="imgBtn" src="images/mp3.avif" />
          Convertir
        </button>

        <a id="downloadLink" style="display: none">Descargar MP3</a>

        <p id="status"></p>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.0/lame.min.js"></script>
    <script src="script.js"></script>
    <script src="script2.js"></script>
  </body>
</html>
