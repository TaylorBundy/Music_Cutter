<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<title>Editor de Audio</title>

<link rel="stylesheet" href="styles.css">

<!-- <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.6/dist/ffmpeg.min.js"></script> -->

</head>

<body>

<div class="card">

<h2>Editor de Audio</h2>

<input type="file" id="file">

<label>Inicio (segundos)</label>
<input type="number" id="start">

<label>Fin (segundos)</label>
<input type="number" id="end">

<label>Fade In (segundos)</label>
<input type="number" id="fadeIn">

<label>Fade Out (segundos)</label>
<input type="number" id="fadeOut">

<label>Formato</label>
<select id="format">
<option value="mp3">MP3</option>
<option value="ogg">OGG</option>
<option value="flac">FLAC</option>
<option value="wav">WAV</option>
</select>

<button onclick="procesar()">Procesar</button>

<br><br>

<a id="download"></a>

</div>
<script src="coi-serviceworker.js"></script>
<!-- <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.6/dist/ffmpeg.min.js"></script> -->
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.10.0/dist/ffmpeg.min.js"></script>
<!-- <script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.0/dist/umd/ffmpeg.min.js"></script> -->
 <script src="https://unpkg.com"></script>
<script src="script.js"></script>

</body>
</html>
